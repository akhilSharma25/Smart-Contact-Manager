<aside data-th-fragment="sidebar" id="logo-sidebar" class="scm-sidebar">
    <style>
        .scm-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000 !important;
            width: 280px;
            height: 100vh;
            padding: 86px 18px 24px;
            background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
            border-right: 1px solid rgba(99, 102, 241, 0.18);
            box-shadow: 24px 0 70px rgba(15, 23, 42, 0.18);
        }

        .sidebar-profile {
            padding: 18px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            margin-bottom: 18px;
        }

        .sidebar-profile img {
            width: 78px;
            height: 78px;
            border-radius: 999px;
            object-fit: cover;
            border: 3px solid rgba(129, 140, 248, 0.95);
            margin-bottom: 12px;
        }

        .user-name-text {
            margin: 0;
            color: #f8fafc;
            font-weight: 700;
            font-size: 0.98rem;
        }

        .welcome-msg {
            margin: 6px 0 0;
            color: rgba(226, 232, 240, 0.8);
            font-size: 0.83rem;
        }

        .sidebar-nav {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            text-decoration: none;
            color: #e2e8f0;
            font-weight: 600;
            border-radius: 14px;
            transition: all 0.2s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(99, 102, 241, 0.2);
            color: #fff;
            transform: translateX(2px);
        }

        .nav-link i {
            width: 18px;
            text-align: center;
            color: #c7d2fe;
        }

        .logout-link {
            margin-top: 12px;
            color: #fecaca;
        }

        .logout-link:hover {
            background: rgba(248, 113, 113, 0.14);
            color: #fff;
        }

        @media (max-width: 640px) {
            .scm-sidebar {
                transform: translateX(-100%);
            }

            .scm-sidebar.open {
                transform: translateX(0);
            }
        }
    </style>

    <div class="sidebar-profile">
        <img
            data-th-src="${loggedInUser.profilePic}"
            src="/images/default-profile.png"
            onerror="this.onerror=null; this.src='/images/default-profile.png';"
            alt="Profile"
        />
        <p class="user-name-text" data-th-text="${loggedInUser.name}">User Name</p>
        <p class="welcome-msg">Welcome to SCM 2.0</p>
    </div>

    <ul class="sidebar-nav">
        <li>
            <a data-th-href="@{'/user/dashboard'}" class="nav-link">
                <i class="fa-solid fa-gauge"></i>
                <span>Dashboard</span>
            </a>
        </li>
        <li>
            <a data-th-href="@{'/user/profile'}" class="nav-link active">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </a>
        </li>
        <li>
            <a data-th-href="@{'/user/contacts/add'}" class="nav-link">
                <i class="fa-solid fa-plus"></i>
                <span>Add Contact</span>
            </a>
        </li>
        <li>
            <a data-th-href="@{'/user/contacts'}" class="nav-link">
                <i class="fa-solid fa-address-book"></i>
                <span>View Contacts</span>
            </a>
        </li>
        <li>
            <a data-th-href="@{'/logout'}" class="nav-link logout-link">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>
        </li>
    </ul>
</aside>
