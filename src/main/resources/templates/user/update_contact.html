<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}">
<head>
    <title>Update Contact</title>
</head>
<body>
<div id="content">

    <div th:if="${loggedInUser}">
        <div data-th-replace="~{user/sidebar :: sidebar}"></div>
    </div>

    <div style="margin-left: 260px; padding: 40px; background-color: #f8fafc; min-height: 100vh; font-family: Arial, sans-serif; box-sizing: border-box;">

        <div style="background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; border: 1px solid #e2e8f0; box-sizing: border-box;">

            <h1 style="text-align: center; color: #1e293b; margin-top: 0; margin-bottom: 25px; font-size: 24px;">Update Contact</h1>

            <form th:action="@{'/user/contacts/update/' + ${contactId}}" th:object="${contactForm}" method="post" enctype="multipart/form-data">

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #475569; font-size: 14px;">Contact Name</label>
                    <input type="text" th:field="*{name}" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 16px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #475569; font-size: 14px;">Email</label>
                    <input type="text" th:field="*{email}" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 16px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #475569; font-size: 14px;">Phone</label>
                    <input type="text" th:field="*{phoneNumber}" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 16px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #475569; font-size: 14px;">Address</label>
                    <textarea th:field="*{address}" rows="3" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 16px; resize: vertical;"></textarea>
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #475569; font-size: 14px;">Description</label>
                    <textarea th:field="*{description}" rows="3" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 16px; resize: vertical;"></textarea>
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #475569; font-size: 14px;">Website Link</label>
                    <input type="text" th:field="*{websiteLink}" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 16px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #475569; font-size: 14px;">LinkedIn Link</label>
                    <input type="text" th:field="*{linkedInLink}" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 16px;">
                </div>

                <div style="margin-bottom: 15px; text-align: center;">
                    <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #475569; font-size: 14px; text-align: left;">Profile Image</label>
                    <input type="file" id="image_file_input" th:field="*{contactImage}" style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px dashed #cbd5e1; border-radius: 4px; margin-bottom: 10px;">

                    <img th:if="*{picture} and *{picture != ''}" th:src="*{picture}" id="upload_image_preview" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 2px solid #e2e8f0; display: inline-block;">
                    <img th:unless="*{picture} and *{picture != ''}" src="https://static-00.iconduck.com/assets.00/profile-default-icon-2048x2045-u3j7s5nj.png" id="upload_image_preview" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 2px solid #e2e8f0; display: inline-block;">
                </div>

                <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" th:field="*{favorite}" style="width: 16px; height: 16px;">
                    <label style="font-weight: normal; color: #1e293b; font-size: 14px;">Is this contact your favorite?</label>
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button type="submit" style="flex: 1; padding: 12px; background-color: #0f172a; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer;">Update</button>
                    <button type="reset" style="flex: 1; padding: 12px; background-color: #64748b; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer;">Reset</button>
                </div>

                <a th:href="@{'/user/contacts/delete/' + ${contactId}}" style="display: block; width: 100%; padding: 12px; background-color: #dc2626; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; text-decoration: none; box-sizing: border-box;">
                    Delete Contact
                </a>

            </form>
        </div>
    </div>
</div>

<script th:fragment="script">
    document.getElementById('image_file_input').addEventListener('change', function(event) {
        const reader = new FileReader();
        reader.onload = function() {
            document.getElementById('upload_image_preview').src = reader.result;
        }
        if(event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
    });
</script>
</body>
</html>
